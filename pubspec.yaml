name: untitled
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.2.3
  go_router: ^17.1.0
  sqflite: ^2.4.2
  table_calendar: ^3.1.2
  intl: ^0.19.0
  kiwi: ^5.0.1
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  kiwi_generator: ^4.1.0
  build_runner: ^2.3.3

flutter:
  uses-material-design: true
  assets:
     - assets/icons/
  fonts:
     - family: Poppins
       fonts:
         - asset: fonts/Poppins-Bold.ttf
           weight: 700
         - asset: fonts/Poppins-Medium.ttf
           weight: 500
         - asset: fonts/Poppins-Regular.ttf
           weight: 400
         - asset: fonts/Poppins-SemiBold.ttf
           weight: 600
